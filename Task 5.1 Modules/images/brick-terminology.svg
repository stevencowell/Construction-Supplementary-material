<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220">
  <rect width="360" height="220" rx="18" ry="18" fill="#f8fafc" />
  <g transform="translate(60,60)">
    <polygon points="0,60 120,0 240,30 120,90" fill="#f97316" opacity="0.8" />
    <polygon points="120,90 240,30 240,120 120,180" fill="#ea580c" opacity="0.85" />
    <polygon points="0,60 120,90 120,180 0,150" fill="#fb923c" opacity="0.9" />
    <rect x="80" y="25" width="45" height="18" rx="4" fill="#fcd34d" />
  </g>
  <g font-family="Roboto, Arial, sans-serif" font-size="14" fill="#0f172a">
    <text x="75" y="35">Bed / Face</text>
    <text x="35" y="140">Stretcher face</text>
    <text x="265" y="115">Header face</text>
    <text x="175" y="55">Frog</text>
