    <line x1="70" y1="140" x2="120" y2="125" />
    <line x1="265" y1="120" x2="240" y2="110" />
    <line x1="190" y1="55" x2="215" y2="70" />
    <line x1="255" y1="185" x2="230" y2="165" />
  </g>
  <text x="90" y="200" font-size="12" font-family="Roboto, Arial, sans-serif" fill="#475569">
    Label the stretcher, header, frog, bed and arrises before you start cutting.
  </text>
</svg>
